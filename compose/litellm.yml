# LiteLLM sidecar fragment — merged into base.yml when a tier-2 provider is selected.
#
# This file is a reference template. triquetra-up.sh generates an equivalent
# fragment at runtime (into a temp file) with the correct volume path and env vars
# for the selected provider injected in.
#
# The script exports LITELLM_CONFIG before running compose so the volume mount
# below resolves correctly if this static file is used directly.

services:
  triquetra:
    depends_on:
      litellm:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - ${LITELLM_CONFIG}:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4000/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
