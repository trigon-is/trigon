services:
  triquetra:
    image: ${TRIQUETRA_IMAGE:-claude-code-env}
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      - HOME=/settings
      - XDG_CONFIG_HOME=/settings/config
      - XDG_CACHE_HOME=/settings/cache
      - XDG_DATA_HOME=/settings/data
      - PLAYWRIGHT_ENABLED=${PLAYWRIGHT_ENABLED:-0}
    volumes:
      - ${PROJECT_ROOT}:/app
      - ${CLAUDE_SETTINGS_DIR}:/settings
      - type: bind
        source: ${PROJECT_ROOT_2:-/tmp/empty-volume-placeholder}
        target: /app_2
        bind:
          create_host_path: true
      - type: bind
        source: ${PROJECT_ROOT_3:-/tmp/empty-volume-placeholder}
        target: /app_3
        bind:
          create_host_path: true
      - type: bind
        source: ${PROJECT_ROOT_4:-/tmp/empty-volume-placeholder}
        target: /app_4
        bind:
          create_host_path: true
      - type: bind
        source: ${PROJECT_ROOT_5:-/tmp/empty-volume-placeholder}
        target: /app_5
        bind:
          create_host_path: true
    stdin_open: true
    tty: true
    # No network_mode override: default compose network provides NAT outbound
    # with inter-container DNS (needed for litellm sidecar). Use compose/playwright.yml
    # fragment to switch to host networking for Playwright MCP.
