
services:
  claude:
    image: claude-code-env
    working_dir: /app
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      # Force all config/cache/data to live under /settings (persisted)
      - HOME=/settings
      - XDG_CONFIG_HOME=/settings/config
      - XDG_CACHE_HOME=/settings/cache
      - XDG_DATA_HOME=/settings/data
      - PLAYWRIGHT_ENABLED=${PLAYWRIGHT_ENABLED:-0}
    volumes:
      - ${PROJECT_ROOT}:/app   # set by the script below
      - ${CLAUDE_SETTINGS_DIR}:/settings
      # Additional project directories (conditionally mounted)
      - type: bind
        source: ${PROJECT_ROOT_2:-/tmp/empty-volume-placeholder}
        target: /app_2
        bind:
          create_host_path: true
      - type: bind
        source: ${PROJECT_ROOT_3:-/tmp/empty-volume-placeholder}
        target: /app_3
        bind:
          create_host_path: true
      - type: bind
        source: ${PROJECT_ROOT_4:-/tmp/empty-volume-placeholder}
        target: /app_4
        bind:
          create_host_path: true
      - type: bind
        source: ${PROJECT_ROOT_5:-/tmp/empty-volume-placeholder}
        target: /app_5
        bind:
          create_host_path: true
    stdin_open: true           # same as -i
    tty: true                  # same as -t
    network_mode: "bridge"     # explicit: outbound internet via NAT, no inbound ports
